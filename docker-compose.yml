services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: voice-rag-backend
    ports:
      - "8000:8000"
    env_file:
      # Optional: create backend/.env from backend/.env.example to enable
      # Sarvam STT / a real LLM; defaults run fully offline otherwise.
      - path: ./backend/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      AUTO_INDEX_ON_STARTUP: "true"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: voice-rag-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_data:
